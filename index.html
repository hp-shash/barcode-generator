<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Barcode Generator & Scanner Studio</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JsBarcode for 1D Barcode Generation -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- QRCode.js for QR Code Generation -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <!-- Html5-Qrcode for Camera & File Image Scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold tracking-tight text-blue-400 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                Barcode Studio & Scanner
            </h1>
            <!-- Navigation Tabs -->
            <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
                <button onclick="switchTab('generator')" id="btn-generator" class="px-4 py-2 text-sm font-medium rounded-md bg-blue-600 text-white transition">Generator</button>
                <button onclick="switchTab('scanner')" id="btn-scanner" class="px-4 py-2 text-sm font-medium rounded-md text-slate-400 hover:text-white transition">Scanner & Upload</button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6">

        <!-- GENERATOR SECTION -->
        <section id="section-generator" class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Controls -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Barcode Type / Symbology</label>
                        <select id="barcodeType" onchange="generateBarcode()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="CODE128">Code 128 (Standard / Alphanumeric)</option>
                            <option value="UPC">UPC-A (Retail)</option>
                            <option value="EAN13">EAN-13 (International Retail)</option>
                            <option value="CODE39">Code 39</option>
                            <option value="qrcode">QR Code</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Data / Text / SKU Content</label>
                        <input type="text" id="barcodeValue" value="PRO-SKU-987654" oninput="generateBarcode()" placeholder="Enter data to encode..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Bar Width</label>
                            <input type="range" id="barWidth" min="1" max="4" value="2" oninput="generateBarcode()" class="w-full accent-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-1">Height</label>
                            <input type="range" id="barHeight" min="40" max="150" value="80" oninput="generateBarcode()" class="w-full accent-blue-500">
                        </div>
                    </div>

                    <div class="flex items-center gap-2 pt-2">
                        <input type="checkbox" id="showText" checked onchange="generateBarcode()" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-blue-500 h-4 w-4">
                        <label for="showText" class="text-sm text-slate-300">Display Text Below Barcode</label>
                    </div>
                </div>

                <!-- Preview Box -->
                <div class="flex flex-col items-center justify-center bg-slate-900/50 border border-slate-700 rounded-xl p-6 text-center">
                    <div class="bg-white p-6 rounded-lg shadow-inner max-w-full overflow-x-auto flex items-center justify-center min-h-[180px]">
                        <!-- Canvas for 1D Barcodes -->
                        <canvas id="barcodeCanvas" class="max-w-full"></canvas>
                        <!-- Div for QR Code -->
                        <div id="qrcodeContainer" class="hidden"></div>
                    </div>
                    <p id="errorMsg" class="text-xs text-red-400 mt-2 hidden">Invalid formatting or data length for this symbology.</p>

                    <!-- Export Buttons -->
                    <div class="flex flex-wrap gap-3 mt-6 w-full justify-center">
                        <button onclick="downloadBarcode('png')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg transition text-sm shadow">Download PNG</button>
                        <button onclick="printBarcode()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 px-4 rounded-lg transition text-sm shadow">Print Label</button>
                    </div>
                </div>

            </div>
        </section>

        <!-- SCANNER & UPLOAD SECTION -->
        <section id="section-scanner" class="space-y-6 hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Option A: Upload File Image -->
                <div class="flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-700 pb-6 md:pb-0 md:pr-6">
                    <div>
                        <h2 class="text-lg font-semibold text-slate-200 mb-2">Upload Barcode Image File</h2>
                        <p class="text-xs text-slate-400 mb-4">Select a saved PNG, JPG, or screenshot containing a barcode or QR code from your device gallery.</p>
                        
                        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-600 hover:border-blue-500 bg-slate-900/50 rounded-xl p-6 cursor-pointer transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                            <span class="text-sm font-medium text-slate-300">Choose Image File</span>
                            <input type="file" id="barcodeFileInput" accept="image/*" onchange="scanUploadedFile(event)" class="hidden">
                        </label>
                    </div>
                    <div id="fileScanResultContainer" class="mt-4 hidden bg-slate-900 p-4 rounded-lg border border-slate-700">
                        <span class="text-xs font-semibold text-blue-400 block mb-1">Decoded Data Result:</span>
                        <p id="fileScanResultText" class="text-sm text-white font-mono break-all select-all"></p>
                    </div>
                </div>

                <!-- Option B: Live Camera Scan -->
                <div class="flex flex-col justify-
